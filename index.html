<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Super Browser Bros</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #10131c;
    font-family: "Courier New", ui-monospace, monospace;
    color: #e8eefc;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    padding: 10px;
  }
  #stage {
    position: relative;
    width: min(100%, 960px);
    aspect-ratio: 800 / 480;
    max-height: calc(100vh - 100px);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 3px #2a3350, 0 18px 50px rgba(0,0,0,.75);
    background: #5c94fc;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ---------- Overlay ---------- */
  #overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8, 12, 24, .82);
    backdrop-filter: blur(3px);
    padding: 16px;
    overflow-y: auto;
    z-index: 10;
  }
  #overlay.hidden { display: none; }

  .panel {
    width: min(560px, 100%);
    background: linear-gradient(180deg, #1d2438, #151a29);
    border: 2px solid #3c4a72;
    border-radius: 14px;
    padding: 22px 24px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0 } to { transform: scale(1); opacity: 1 } }

  .panel h1 {
    margin: 0 0 4px;
    font-size: clamp(20px, 4.2vw, 30px);
    letter-spacing: 1px;
    text-align: center;
    color: #ffd44d;
    text-shadow: 0 3px 0 #a8540b, 0 5px 12px rgba(0,0,0,.6);
  }
  .panel .sub {
    margin: 0 0 16px; text-align: center;
    font-size: 12px; color: #8fa0c8; letter-spacing: .5px;
  }

  .controls {
    display: grid; gap: 6px;
    font-size: 12px; color: #b9c6e4;
    margin-bottom: 18px;
    background: #101625; border: 1px solid #2b3552; border-radius: 9px;
    padding: 12px 14px;
  }
  .controls span { display: flex; justify-content: space-between; gap: 12px; }
  .controls b {
    color: #ffd44d; font-weight: 700;
    background: #232c45; border-radius: 5px; padding: 1px 7px;
    border: 1px solid #38456b;
    white-space: nowrap;
  }

  button {
    font-family: inherit; font-size: 14px; font-weight: 700;
    letter-spacing: .5px; cursor: pointer;
    padding: 12px 18px; border-radius: 9px; border: none;
    background: linear-gradient(180deg, #4fd04f, #2c9a2c);
    color: #07240a; width: 100%;
    box-shadow: 0 4px 0 #1c6b1c, 0 8px 18px rgba(0,0,0,.4);
    transition: transform .06s, box-shadow .06s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #1c6b1c; }
  button.ghost {
    background: linear-gradient(180deg, #3a4667, #2a3350);
    color: #cfe0ff; box-shadow: 0 4px 0 #1a2138;
  }

  .scoreline {
    text-align: center; font-size: 15px; margin: 6px 0 16px; color: #cfe0ff;
  }
  .scoreline b { color: #ffd44d; font-size: 22px; }

  .hs { margin-top: 18px; }
  .hs h2 {
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    color: #7f92bd; margin: 0 0 10px; text-align: center;
  }
  .hs ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .hs li {
    display: grid; grid-template-columns: 30px 1fr auto;
    gap: 8px; align-items: center;
    font-size: 13px; padding: 6px 10px; border-radius: 7px;
    background: #131a2b; border: 1px solid #232d47;
  }
  .hs li:nth-child(1) { background: #2a2412; border-color: #6b551b; }
  .hs li:nth-child(1) .rank { color: #ffd44d; }
  .hs li:nth-child(2) { background: #1e222e; border-color: #43495c; }
  .hs li:nth-child(3) { background: #221a14; border-color: #5c4230; }
  .rank { color: #6d7fa8; }
  .nm { color: #dfe8ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc { color: #6ee06e; font-weight: 700; }
  .empty { text-align: center; color: #66779e; font-size: 12px; margin: 0; }

  .inputrow { display: flex; gap: 8px; margin: 14px 0 6px; }
  .inputrow input {
    flex: 1; font-family: inherit; font-size: 14px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 11px 12px; border-radius: 9px;
    background: #0d1322; border: 2px solid #34406a; color: #ffd44d;
    outline: none; min-width: 0;
  }
  .inputrow input:focus { border-color: #ffd44d; }
  .inputrow button { width: auto; padding: 11px 18px; }

  /* ---------- Touch ---------- */
  #touch {
    display: none; gap: 12px; width: min(100%, 960px);
    justify-content: space-between; padding: 0 4px;
  }
  #touch .grp { display: flex; gap: 12px; }
  #touch button {
    width: 68px; height: 56px; font-size: 20px; padding: 0;
    background: linear-gradient(180deg, #3a4667, #232c45);
    color: #cfe0ff; box-shadow: 0 4px 0 #141a2c; border-radius: 12px;
  }
  @media (pointer: coarse) {
    #touch { display: flex; }
  }
  .muted { color: #555 !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="800" height="480"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="touch">
    <div class="grp">
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowRight">▶</button>
    </div>
    <div class="grp">
      <button data-key="ShiftLeft">🏃</button>
      <button data-key="Space">▲</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================
   SUPER BROWSER BROS  –  Jump'n'Run im Browser
   ========================================================= */

// ---------------- Canvas ----------------
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const VW = canvas.width;
const VH = canvas.height;
const TS = 32;                       // Tile-Größe

// ---------------- Physik-Konstanten ----------------
const GRAVITY   = 0.8;
const MAX_FALL  = 15;
const JUMP_V    = -15;
const ACCEL     = 0.9;
const WALK_MAX  = 4.2;
const RUN_MAX   = 6.6;

// ---------------- Spielzustand ----------------
const game = {
  mode: 'start',      // start | playing | paused | over
  score: 0,
  coins: 0,
  lives: 3,
  time: 300,
  camX: 0,
  deathTimer: 0,
  frames: 0
};

const player = {
  x: 64, y: 352, w: 24, h: 30,
  vx: 0, vy: 0,
  onGround: false,
  jumpLock: false,
  facing: 1,
  anim: 0,
  dead: false
};

let level = null;
let particles = [];
let muted = false;

// ---------------- Hilfsfunktionen ----------------
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------------- Sound (WebAudio) ----------------
let audioCtx = null;
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* Audio nicht verfügbar */ }
}

// ---------------- Bestenliste (localStorage) ----------------
const HS_KEY = 'sbb_highscores_v1';
const HS_MAX = 10;

function loadScores() {
  try {
    const raw = localStorage.getItem(HS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(arr)) return [];
    return arr.filter(e => e && typeof e.score === 'number')
              .sort((a, b) => b.score - a.score)
              .slice(0, HS_MAX);
  } catch (e) { return []; }
}
function saveScores(arr) {
  try { localStorage.setItem(HS_KEY, JSON.stringify(arr.slice(0, HS_MAX))); } catch (e) {}
}
function qualifies(score) {
  if (score <= 0) return false;
  const list = loadScores();
  return list.length < HS_MAX || score > list[list.length - 1].score;
}
function addScore(name, score) {
  const list = loadScores();
  list.push({ name: (name || 'SPIELER').toUpperCase().slice(0, 12), score, date: Date.now() });
  list.sort((a, b) => b.score - a.score);
  saveScores(list.slice(0, HS_MAX));
}
function highscoreHTML() {
  const list = loadScores();
  if (!list.length) {
    return `<div class="hs"><h2>Bestenliste</h2>
      <p class="empty">Noch keine Einträge – sei der Erste!</p></div>`;
  }
  const items = list.map((e, i) => `
    <li>
      <span class="rank">${i + 1}.</span>
      <span class="nm">${esc(e.name)}</span>
      <span class="sc">${e.score.toLocaleString('de-DE')}</span>
    </li>`).join('');
  return `<div class="hs"><h2>Bestenliste</h2><ol>${items}</ol></div>`;
}

// =========================================================
//  LEVEL-AUFBAU
// =========================================================
const SOLID = new Set(['#', 'X', '?', 'U', 'P']);

function buildLevel() {
  const W = 210, H = 15;
  const grid = Array.from({ length: H }, () => new Array(W).fill(' '));

  const set  = (x, y, c) => { if (x >= 0 && x < W && y >= 0 && y < H) grid[y][x] = c; };
  const rect = (x, y, w, h, c) => {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, c);
  };
  const coinRow = (x, y, n) => { for (let i = 0; i < n; i++) set(x + i, y, 'C'); };

  // ---- Boden ----
  rect(0, 13, W, 2, '#');

  // ---- Gruben ----
  const pits = [[37, 40], [64, 67], [101, 105], [139, 142], [172, 174]];
  for (const [a, b] of pits) {
    for (let x = a; x <= b; x++) { set(x, 13, ' '); set(x, 14, ' '); }
  }

  // ---- Abschnitt 1 : Aufwärmen ----
  set(8, 9, '?');
  set(12, 9, '?'); set(13, 9, '?');
  set(12, 5, '?');
  coinRow(11, 8, 4);
  set(18, 12, 'G');
  rect(22, 11, 2, 2, 'P');
  set(27, 12, 'G');
  rect(30, 9, 3, 1, 'X');
  coinRow(30, 8, 3);
  set(34, 12, 'G');

  // ---- Abschnitt 2 ----
  set(44, 12, 'G');
  coinRow(46, 8, 4);
  set(48, 9, '?');
  rect(52, 10, 4, 1, 'X');
  coinRow(52, 9, 4);
  set(57, 12, 'G');
  set(59, 12, 'G');
  set(60, 9, '?'); set(61, 9, '?');

  // ---- Abschnitt 3 ----
  set(70, 12, 'G');
  rect(72, 11, 2, 2, 'P');
  set(76, 12, 'G'); set(78, 12, 'G');
  rect(82, 9, 4, 1, 'X');
  coinRow(82, 8, 4);
  set(87, 9, '?');
  set(90, 12, 'G');
  rect(94, 10, 3, 1, 'X');
  coinRow(94, 9, 3);

  // ---- Abschnitt 4 ----
  set(108, 12, 'G');
  rect(110, 10, 2, 3, 'P');
  set(115, 12, 'G');
  for (let i = 0; i < 4; i++) rect(120 + i, 12 - i, 1, 1 + i, 'X');
  coinRow(126, 8, 4);
  set(132, 12, 'G'); set(134, 12, 'G');
  set(135, 9, '?');

  // ---- Abschnitt 5 ----
  set(145, 12, 'G');
  rect(148, 9, 5, 1, 'X');
  coinRow(148, 8, 5);
  set(155, 12, 'G');
  rect(158, 11, 2, 2, 'P');
  set(163, 9, '?'); set(164, 9, '?'); set(165, 9, '?');
  set(168, 12, 'G');

  // ---- Finale : Treppe + Fahne ----
  for (let i = 0; i < 6; i++) rect(180 + i, 12 - i, 1, 1 + i, 'X');
  const flagX = 192;

  // ---- Gegner einsammeln ----
  const enemies = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (grid[y][x] === 'G') {
        grid[y][x] = ' ';
        enemies.push({
          x: x * TS + 2, y: y * TS + 4,
          w: 28, h: 26,
          vx: -1.15, vy: 0,
          alive: true, squash: 0
        });
      }
    }
  }

  return {
    grid, W, H, enemies, flagX,
    playerStart: { x: 2 * TS, y: 11 * TS }
  };
}

// ---------------- Tile-Zugriff ----------------
function tileAt(tx, ty) {
  if (!level) return ' ';
  if (tx < 0) return '#';                   // Level-Rand links
  if (tx >= level.W) return ' ';
  if (ty < 0 || ty >= level.H) return ' ';  // oben/unten = frei
  return level.grid[ty][tx];
}
function isSolid(c) { return SOLID.has(c); }

// =========================================================
//  KOLLISION
// =========================================================
function moveX(e, dt) {
  e.x += e.vx * dt;
  const top = Math.floor(e.y / TS);
  const bot = Math.floor((e.y + e.h - 1) / TS);

  if (e.vx > 0) {
    const tx = Math.floor((e.x + e.w - 1) / TS);
    for (let ty = top; ty <= bot; ty++) {
      if (isSolid(tileAt(tx, ty))) { e.x = tx * TS - e.w - 0.01; e.vx = 0; return; }
    }
  } else if (e.vx < 0) {
    const tx = Math.floor(e.x / TS);
    for (let ty = top; ty <= bot; ty++) {
      if (isSolid(tileAt(tx, ty))) { e.x = (tx + 1) * TS + 0.01; e.vx = 0; return; }
    }
  }
}

function moveY(e, dt) {
  e.y += e.vy * dt;

  if (e.y < 0) { e.y = 0; if (e.vy < 0) e.vy = 0; }

  const left  = Math.floor(e.x / TS);
  const right = Math.floor((e.x + e.w - 1) / TS);

  if (e.vy > 0) {
    const ty = Math.floor((e.y + e.h - 1) / TS);
    for (let tx = left; tx <= right; tx++) {
      if (isSolid(tileAt(tx, ty))) {
        e.y = ty * TS - e.h - 0.01;
        e.vy = 0;
        e.onGround = true;
        return;
      }
    }
  } else if (e.vy < 0) {
    const ty = Math.floor(e.y / TS);
    for (let tx = left; tx <= right; tx++) {
      const c = tileAt(tx, ty);
      if (isSolid(c)) {
        if (e === player) headBump(tx, ty, c);
        e.y = (ty + 1) * TS + 0.01;
        e.vy = 0;
        return;
      }
    }
  }
}

function headBump(tx, ty, c) {
  if (c === '?') {
    level.grid[ty][tx] = 'U';
    game.coins++;
    game.score += 200;
    addPopup(tx * TS + 16, ty * TS - 6, '+200');
    for (let i = 0; i < 6; i++) addSparkle(tx * TS + 16, ty * TS + 16);
    beep(880, 0.06, 'square', 0.05);
    setTimeout(() => beep(1318, 0.09, 'square', 0.045), 55);
  } else if (c === 'X') {
    addPopup(tx * TS + 16, ty * TS - 6, '+10');
    game.score += 10;
    beep(150, 0.05, 'square', 0.04);
  }
}

// =========================================================
//  PARTIKEL
// =========================================================
function addSparkle(x, y) {
  particles.push({
    x, y,
    vx: (Math.random() - 0.5) * 4,
    vy: -Math.random() * 4 - 1,
    life: 1, type: 'spark'
  });
}
function addPopup(x, y, text) {
  particles.push({ x, y, vx: 0, vy: -1.4, life: 1, type: 'text', text });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += (p.type === 'text' ? 0.02 : 0.22) * dt;
    p.life -= 0.018 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// =========================================================
//  SPIELER
// =========================================================
function collectCoins() {
  const x0 = Math.floor(player.x / TS);
  const x1 = Math.floor((player.x + player.w - 1) / TS);
  const y0 = Math.floor(player.y / TS);
  const y1 = Math.floor((player.y + player.h - 1) / TS);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (tileAt(x, y) === 'C') {
        level.grid[y][x] = ' ';
        game.coins++;
        game.score += 100;
        addPopup(x * TS + 16, y * TS, '+100');
        for (let i = 0; i < 5; i++) addSparkle(x * TS + 16, y * TS + 16);
        beep(1046, 0.06, 'square', 0.05);
        setTimeout(() => beep(1568, 0.08, 'square', 0.04), 50);
      }
    }
  }
}

function updatePlayer(dt) {
  // ---- Sterbe-Animation ----
  if (player.dead) {
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
    game.deathTimer += dt;
    if (game.deathTimer > 95) onDeathComplete();
    return;
  }

  const run = !!(keys['ShiftLeft'] || keys['ShiftRight']);
  const maxSpd = run ? RUN_MAX : WALK_MAX;

  let dir = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) dir -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dir += 1;

  if (dir !== 0) {
    player.vx += dir * ACCEL * dt * (run ? 1.2 : 1);
    player.facing = dir;
  } else {
    player.vx *= Math.pow(0.80, dt);
    if (Math.abs(player.vx) < 0.06) player.vx = 0;
  }
  player.vx = clamp(player.vx, -maxSpd, maxSpd);

  // ---- Springen ----
  const jumpHeld = !!(keys['Space'] || keys['ArrowUp'] || keys['KeyW']);
  if (jumpHeld && player.onGround && !player.jumpLock) {
    player.vy = JUMP_V;
    player.onGround = false;
    player.jumpLock = true;
    beep(440, 0.09, 'square', 0.05, 320);
  }
  if (!jumpHeld) {
    player.jumpLock = false;
    if (player.vy < -5) player.vy = -5;   // kurzer Hüpfer bei frühem Loslassen
  }

  // ---- Schwerkraft ----
  player.vy += GRAVITY * dt;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  // ---- Bewegung + Kollision ----
  player.onGround = false;
  moveX(player, dt);
  moveY(player, dt);

  // ---- Lauf-Animation ----
  if (player.onGround && Math.abs(player.vx) > 0.4) {
    player.anim += Math.abs(player.vx) * 0.09 * dt;
  } else {
    player.anim *= 0.9;
  }

  // ---- Münzen ----
  collectCoins();

  // ---- Gegner ----
  for (const en of level.enemies) {
    if (!en.alive || en.squash > 0) continue;
    if (aabb(player, en)) {
      const prevBottom = player.y + player.h - player.vy * dt;
      const stomping = player.vy > 0 && prevBottom <= en.y + 12;
      if (stomping) {
        en.squash = 0.32;
        en.vx = 0;
        player.vy = -10;
        game.score += 200;
        addPopup(en.x + en.w / 2, en.y - 4, '+200');
        for (let i = 0; i < 6; i++) addSparkle(en.x + en.w / 2, en.y + en.h / 2);
        beep(620, 0.07, 'square', 0.06, -200);
      } else {
        killPlayer();
        return;
      }
    }
  }

  // ---- Absturz in eine Grube ----
  if (player.y > VH + 120) { killPlayer(); return; }

  // ---- Ziel erreicht? ----
  if (player.x + player.w > level.flagX * TS + 8) {
    endGame(true);
  }
}

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function killPlayer() {
  if (player.dead || game.mode !== 'playing') return;
  player.dead = true;
  player.vy = -12;
  player.vx = 0;
  game.deathTimer = 0;
  beep(320, 0.45, 'sawtooth', 0.06, -260);
}

function onDeathComplete() {
  game.lives--;
  if (game.lives <= 0) {
    endGame(false);
    return;
  }
  game.time = 300;
  resetLevel();
}

// =========================================================
//  GEGNER
// =========================================================
function updateEnemies(dt) {
  for (const en of level.enemies) {
    if (!en.alive) continue;

    if (en.squash > 0) {
      en.squash -= dt * 0.06;
      if (en.squash <= 0) en.alive = false;
      continue;
    }

    // Nur in der Nähe der Kamera simulieren
    if (Math.abs(en.x - player.x) > 1700) continue;

    en.vy += GRAVITY * dt;
    if (en.vy > MAX_FALL) en.vy = MAX_FALL;

    // horizontal
    const nx = en.x + en.vx * dt;
    const frontX = en.vx > 0 ? nx + en.w + 1 : nx - 1;
    const midY = en.y + en.h * 0.55;
    if (isSolid(tileAt(Math.floor(frontX / TS), Math.floor(midY / TS)))) {
      en.vx *= -1;
    } else {
      en.x = nx;
    }

    // vertikal
    en.y += en.vy * dt;
    const footTy = Math.floor((en.y + en.h) / TS);
    const midTx  = Math.floor((en.x + en.w / 2) / TS);
    if (en.vy >= 0 && isSolid(tileAt(midTx, footTy))) {
      en.y = footTy * TS - en.h;
      en.vy = 0;
    }

    if (en.y > VH + 260) en.alive = false;
  }
}

// =========================================================
//  KAMERA / ZEIT
// =========================================================
function updateCamera() {
  const target = player.x + player.w / 2 - VW * 0.42;
  const maxCam = level.W * TS - VW;
  game.camX += (clamp(target, 0, maxCam) - game.camX) * 0.16;
  if (Math.abs(game.camX - clamp(target, 0, maxCam)) < 0.4) {
    game.camX = clamp(target, 0, maxCam);
  }
}

function updateTimer(dt) {
  game.time -= dt * 0.025;
  if (game.time <= 0) {
    game.time = 0;
    killPlayer();
  }
}

// =========================================================
//  RENDERING
// =========================================================
const clouds = [];
const hills  = [];
(function initScenery() {
  for (let i = 0; i < 14; i++) {
    clouds.push({
      x: i * 340 + Math.random() * 160,
      y: 30 + Math.random() * 130,
      s: 0.7 + Math.random() * 0.8
    });
  }
  for (let i = 0; i < 16; i++) {
    hills.push({
      x: i * 380 + Math.random() * 120,
      r: 60 + Math.random() * 70
    });
  }
})();

function drawCloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 20 * s, 0, Math.PI * 2);
  ctx.arc(x + 22 * s, y - 10 * s, 26 * s, 0, Math.PI * 2);
  ctx.arc(x + 52 * s, y, 20 * s, 0, Math.PI * 2);
  ctx.arc(x + 26 * s, y + 8 * s, 22 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#4a86f7');
  g.addColorStop(0.65, '#7fb6ff');
  g.addColorStop(1, '#bfe0ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // Wolken (Parallax 0.3)
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  for (const c of clouds) {
    const span = VW + 500;
    let x = ((c.x - game.camX * 0.3) % span + span) % span - 250;
    drawCloud(x, c.y, c.s);
  }

  // Hügel (Parallax 0.5)
  ctx.fillStyle = '#3f8f2c';
  for (const h of hills) {
    const span = VW + 700;
    let x = ((h.x - game.camX * 0.5) % span + span) % span - 350;
    ctx.beginPath();
    ctx.moveTo(x - 150, VH);
    ctx.quadraticCurveTo(x, VH - h.r * 2.3, x + 150, VH);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  for (const h of hills) {
    const span = VW + 700;
    let x = ((h.x - game.camX * 0.5) % span + span) % span - 350;
    ctx.beginPath();
    ctx.moveTo(x - 60, VH);
    ctx.quadraticCurveTo(x, VH - h.r * 2.3, x + 40, VH);
    ctx.closePath();
    ctx.fill();
  }
}

function drawTile(c, px, py) {
  switch (c) {
    case '#': { // Boden
      ctx.fillStyle = '#b5611c';
      ctx.fillRect(px, py, TS, TS);
      ctx.fillStyle = '#d67c2c';
      ctx.fillRect(px + 3, py + 3, 12, 12);
      ctx.fillRect(px + 17, py + 3, 12, 12);
      ctx.fillRect(px + 3, py + 17, 12, 12);
      ctx.fillRect(px + 17, py + 17, 12, 12);
      ctx.fillStyle = 'rgba(0,0,0,.16)';
      ctx.fillRect(px, py, TS, 3);
      break;
    }
    case 'X': { // Ziegel
      ctx.fillStyle = '#c96a2b';
      ctx.fillRect(px, py, TS, TS);
      ctx.strokeStyle = '#8f4718';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px, py + 16); ctx.lineTo(px + TS, py + 16);
      ctx.moveTo(px + 16, py); ctx.lineTo(px + 16, py + 16);
      ctx.moveTo(px + 8, py + 16); ctx.lineTo(px + 8, py + TS);
      ctx.moveTo(px + 24, py + 16); ctx.lineTo(px + 24, py + TS);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.strokeRect(px + 1, py + 1, TS - 2, TS - 2);
      break;
    }
    case '?': { // Fragezeichen-Block
      const t = performance.now() / 320;
      const pulse = 0.5 + 0.5 * Math.sin(t);
      const grd = ctx.createLinearGradient(px, py, px, py + TS);
      grd.addColorStop(0, '#ffd75e');
      grd.addColorStop(1, '#d98f0d');
      ctx.fillStyle = grd;
      ctx.fillRect(px, py, TS, TS);
      ctx.strokeStyle = 'rgba(120,70,0,.85)';
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 1, py + 1, TS - 2, TS - 2);
      ctx.fillStyle = `rgba(255,255,255,${0.25 + pulse * 0.35})`;
      ctx.fillRect(px + 4, py + 4, TS - 8, 4);
      ctx.fillStyle = '#7a4a00';
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', px + TS / 2, py + TS / 2 + 1);
      break;
    }
    case 'U': { // verbrauchter Block
      ctx.fillStyle = '#8a5a1e';
      ctx.fillRect(px, py, TS, TS);
      ctx.fillStyle = '#6b4416';
      ctx.fillRect(px + 4, py + 4, TS - 8, TS - 8);
      ctx.strokeStyle = 'rgba(0,0,0,.35)';
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 1, py + 1, TS - 2, TS - 2);
      break;
    }
    case 'P': { // Röhre
      const above = tileAt(Math.floor(px / TS), Math.floor(py / TS) - 1) === 'P';
      ctx.fillStyle = '#2fa02f';
      ctx.fillRect(px, py, TS, TS);
      ctx.fillStyle = '#4fd04f';
      ctx.fillRect(px + 4, py, 7, TS);
      ctx.fillStyle = '#1d7a1d';
      ctx.fillRect(px + TS - 7, py, 7, TS);
      if (!above) {
        ctx.fillStyle = '#2fa02f';
        ctx.fillRect(px - 3, py, TS + 6, 12);
        ctx.fillStyle = '#4fd04f';
        ctx.fillRect(px - 1, py + 2, 8, 8);
        ctx.fillStyle = '#1d7a1d';
        ctx.fillRect(px + TS - 5, py + 2, 8, 8);
        ctx.strokeStyle = 'rgba(0,0,0,.35)';
        ctx.lineWidth = 2;
        ctx.strokeRect(px - 3, py, TS + 6, 12);
      }
      break;
    }
    case 'C': { // Münze
      const t = performance.now() / 180;
      const wob = Math.abs(Math.cos(t));
      const cw = 4 + wob * 11;
      const cx = px + TS / 2, cy = py + TS / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.ellipse(0, 0, cw / 2 + 2, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe97a';
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(1, cw / 2 - 1), 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      if (cw > 5) ctx.fillRect(-1, -6, 2, 12);
      ctx.restore();
      break;
    }
  }
}

function drawTiles() {
  const x0 = Math.max(0, Math.floor(game.camX / TS) - 1);
  const x1 = Math.min(level.W - 1, Math.floor((game.camX + VW) / TS) + 1);
  for (let ty = 0; ty < level.H; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const c = level.grid[ty][tx];
      if (c !== ' ') drawTile(c, tx * TS, ty * TS);
    }
  }
}

function drawFlag() {
  const fx = level.flagX * TS + 16;
  const baseY = 5 * TS;
  const poleH = 8 * TS;

  // Sockel
  ctx.fillStyle = '#9aa4b8';
  ctx.fillRect(fx - 12, baseY + poleH - 6, 24, 8);
  // Stange
  ctx.fillStyle = '#d8dee9';
  ctx.fillRect(fx - 2, baseY, 4, poleH);
  ctx.fillStyle = '#aab4c8';
  ctx.fillRect(fx + 1, baseY, 1, poleH);
  // Kugel
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(fx, baseY - 5, 7, 0, Math.PI * 2);
  ctx.fill();
  // Fahne
  const wave = Math.sin(performance.now() / 260) * 4;
  ctx.fillStyle = '#e23b3b';
  ctx.beginPath();
  ctx.moveTo(fx + 2, baseY + 8);
  ctx.quadraticCurveTo(fx + 30, baseY + 14 + wave, fx + 52, baseY + 24);
  ctx.quadraticCurveTo(fx + 30, baseY + 34 + wave, fx + 2, baseY + 42);
  ctx.closePath();
  ctx.fill();
  // Stern auf der Fahne
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(fx + 20, baseY + 25, 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawEnemy(en) {
  const { x, y, w, h } = en;
  if (en.squash > 0) {
    ctx.fillStyle = '#7a4a20';
    rr(x, y + h - 9, w, 9, 4);
    ctx.fill();
    return;
  }
  const walk = Math.sin(performance.now() / 130) * 2;

  // Füße
  ctx.fillStyle = '#3b2410';
  ctx.beginPath();
  ctx.ellipse(x + 8 + walk, y + h - 3, 8, 5, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w - 8 - walk, y + h - 3, 8, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Körper
  const grd = ctx.createLinearGradient(x, y, x, y + h);
  grd.addColorStop(0, '#a35a1f');
  grd.addColorStop(1, '#6d3a12');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(x + 2, y + h - 6);
  ctx.quadraticCurveTo(x + 2, y, x + w / 2, y);
  ctx.quadraticCurveTo(x + w - 2, y, x + w - 2, y + h - 6);
  ctx.quadraticCurveTo(x + w / 2, y + h - 1, x + 2, y + h - 6);
  ctx.fill();

  // Augen
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(x + 9, y + 11, 5, 6, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w - 9, y + 11, 5, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pupillen (blicken in Laufrichtung)
  const look = en.vx < 0 ? -1.6 : 1.6;
  ctx.fillStyle = '#1a1008';
  ctx.beginPath();
  ctx.arc(x + 9 + look, y + 12, 2.6, 0, Math.PI * 2);
  ctx.arc(x + w - 9 + look, y + 12, 2.6, 0, Math.PI * 2);
  ctx.fill();

  // Augenbrauen
  ctx.strokeStyle = '#2c1808';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x + 4, y + 5); ctx.lineTo(x + 13, y + 8);
  ctx.moveTo(x + w - 4, y + 5); ctx.lineTo(x + w - 13, y + 8);
  ctx.stroke();
}

function drawPlayer() {
  const w = player.w, h = player.h;
  const walking = player.onGround && Math.abs(player.vx) > 0.4;
  const legSwing = walking ? Math.sin(player.anim) * 4 : 0;
  const airPose = !player.onGround;

  ctx.save();
  ctx.translate(player.x + w / 2, player.y);
  ctx.scale(player.facing, 1);
  ctx.translate(-w / 2, 0);

  // Schatten
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.ellipse(w / 2, h - 1, 11, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Schuhe
  ctx.fillStyle = '#5a2d0c';
  if (airPose) {
    ctx.fillRect(1, h - 7, 10, 7);
    ctx.fillRect(13, h - 9, 10, 7);
  } else {
    ctx.fillRect(2 + legSwing, h - 6, 9, 6);
    ctx.fillRect(13 - legSwing, h - 6, 9, 6);
  }

  // Overall
  ctx.fillStyle = '#2b57d6';
  ctx.fillRect(5, 15, 14, 11);
  // Träger
  ctx.fillRect(6, 13, 3, 4);
  ctx.fillRect(15, 13, 3, 4);
  // Knöpfe
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(6, 18, 2, 2);
  ctx.fillRect(16, 18, 2, 2);

  // Hemd / Arme
  ctx.fillStyle = '#e03131';
  ctx.fillRect(3, 13, 18, 5);
  ctx.fillRect(0, 15, 5, 8);
  ctx.fillRect(19, 15, 5, 8);

  // Kopf
  ctx.fillStyle = '#f2b58a';
  ctx.fillRect(6, 5, 13, 10);

  // Auge
  ctx.fillStyle = '#22201e';
  ctx.fillRect(13, 7, 3, 4);

  // Schnurrbart
  ctx.fillStyle = '#4a2a12';
  ctx.fillRect(10, 11, 9, 3);

  // Mütze
  ctx.fillStyle = '#e03131';
  ctx.fillRect(5, 0, 14, 5);
  ctx.fillRect(3, 4, 18, 3);
  ctx.fillRect(15, 4, 8, 3);          // Schirm
  // Mützen-Emblem
  ctx.fillStyle = '#fff';
  ctx.fillRect(10, 1, 4, 3);

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    if (p.type === 'text') {
      ctx.fillStyle = '#fff59a';
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
    } else {
      ctx.fillStyle = '#ffe14d';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // Leiste
  const grd = ctx.createLinearGradient(0, 0, 0, 46);
  grd.addColorStop(0, 'rgba(8,12,24,.72)');
  grd.addColorStop(1, 'rgba(8,12,24,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, VW, 46);

  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';

  const label = (text, x, y, color = '#9fb2d8') => {
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };

  label('SCORE', 18, 14);
  ctx.fillStyle = '#fff';
  ctx.fillText(String(game.score).padStart(6, '0'), 18, 31);

  // Münzen
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath();
  ctx.ellipse(158, 22, 6, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffe97a';
  ctx.beginPath();
  ctx.ellipse(158, 22, 3, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText('× ' + String(game.coins).padStart(2, '0'), 172, 22);

  // Welt
  label('WELT', 300, 14);
  ctx.fillStyle = '#fff';
  ctx.fillText('1-1', 300, 31);

  // Zeit
  ctx.textAlign = 'center';
  label('ZEIT', VW / 2 + 90, 14);
  ctx.fillStyle = game.time < 60 ? '#ff6b6b' : '#fff';
  ctx.fillText(String(Math.ceil(game.time)).padStart(3, '0'), VW / 2 + 90, 31);

  // Leben
  ctx.textAlign = 'right';
  label('LEBEN', VW - 18, 14);
  ctx.fillStyle = '#fff';
  ctx.fillText('♥ '.repeat(Math.max(0, game.lives)).trim() || '–', VW - 18, 31);

  // Ton-Status
  if (muted) {
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText('TON AUS (M)', VW - 18, 60);
  }

  // Pause
  if (game.mode === 'paused') {
    ctx.fillStyle = 'rgba(8,12,24,.72)';
    ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd44d';
    ctx.font = 'bold 42px "Courier New", monospace';
    ctx.fillText('PAUSE', VW / 2, VH / 2 - 10);
    ctx.fillStyle = '#9fb2d8';
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText('P drücken zum Weiterspielen', VW / 2, VH / 2 + 36);
  }
}

function render() {
  drawBackground();

  ctx.save();
  ctx.translate(-Math.round(game.camX), 0);

  drawTiles();
  drawFlag();
  for (const en of level.enemies) {
    if (!en.alive) continue;
    if (en.x + en.w < game.camX - 100 || en.x > game.camX + VW + 100) continue;
    drawEnemy(en);
  }
  drawParticles();
  drawPlayer();

  ctx.restore();

  drawHUD();
}

// =========================================================
//  SPIELABLAUF
// =========================================================
function resetLevel() {
  level = buildLevel();
  player.x = level.playerStart.x;
  player.y = level.playerStart.y;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  player.jumpLock = false;
  player.facing = 1;
  player.anim = 0;
  player.dead = false;
  game.camX = 0;
  game.deathTimer = 0;
  particles = [];
}

function startGame() {
  game.mode = 'playing';
  game.score = 0;
  game.coins = 0;
  game.lives = 3;
  game.time = 300;
  resetLevel();
  hideOverlay();
  beep(523, 0.08, 'square', 0.05);
  setTimeout(() => beep(659, 0.08, 'square', 0.05), 90);
  setTimeout(() => beep(784, 0.12, 'square', 0.05), 180);
}

function endGame(won) {
  if (game.mode === 'over') return;
  game.mode = 'over';
  if (won) {
    game.score += Math.floor(game.time) * 10;
    beep(659, 0.1, 'square', 0.06);
    setTimeout(() => beep(784, 0.1, 'square', 0.06), 110);
    setTimeout(() => beep(1046, 0.25, 'square', 0.06), 220);
  } else {
    beep(392, 0.2, 'sawtooth', 0.05, -180);
    setTimeout(() => beep(262, 0.4, 'sawtooth', 0.05, -120), 200);
  }
  showEndScreen(won);
}

function togglePause() {
  if (game.mode === 'playing') {
    game.mode = 'paused';
  } else if (game.mode === 'paused') {
    game.mode = 'playing';
  }
}

// =========================================================
//  OVERLAY-UI
// =========================================================
const overlay = document.getElementById('overlay');

function hideOverlay() {
  overlay.classList.add('hidden');
  overlay.innerHTML = '';
}
function showOverlay(html) {
  overlay.classList.remove('hidden');
  overlay.innerHTML = html;
}

function showStartScreen() {
  showOverlay(`
    <div class="panel">
      <h1>SUPER BROWSER BROS</h1>
      <p class="sub">Sammle Münzen, besiege Gegner, erreiche die Fahne!</p>
      <div class="controls">
        <span><span>Laufen</span><b>← → / A D</b></span>
        <span><span>Springen</span><b>Leertaste / W / ↑</b></span>
        <span><span>Rennen</span><b>Shift</b></span>
        <span><span>Pause / Ton</span><b>P / M</b></span>
      </div>
      <button id="btnStart">▶ Spiel starten</button>
      ${highscoreHTML()}
    </div>
  `);
  document.getElementById('btnStart').onclick = startGame;
}

function showEndScreen(won) {
  const finalScore = game.score;
  const canSave = qualifies(finalScore);

  showOverlay(`
    <div class="panel">
      <h1 style="color:${won ? '#6ee06e' : '#ff6b6b'}">
        ${won ? 'GESCHAFFT!' : 'GAME OVER'}
      </h1>
      <p class="sub">
        ${won
          ? 'Du hast die Fahne erreicht – stark!'
          : 'Deine Leben sind aufgebraucht.'}
      </p>
      <div class="scoreline">
        Punkte: <b>${finalScore.toLocaleString('de-DE')}</b><br>
        <span style="font-size:12px;color:#8fa0c8">Münzen: ${game.coins}</span>
      </div>
      <div id="saveArea"></div>
      <button id="btnAgain" class="ghost" style="margin-top:14px">↻ Nochmal spielen</button>
      <div id="hsArea">${highscoreHTML()}</div>
    </div>
  `);

  document.getElementById('btnAgain').onclick = startGame;

  const saveArea = document.getElementById('saveArea');
  if (canSave) {
    saveArea.innerHTML = `
      <p class="sub" style="margin:0 0 4px">🏆 Neuer Bestenlisten-Eintrag! Gib deinen Namen ein:</p>
      <div class="inputrow">
        <input id="nameInput" maxlength="12" placeholder="SPIELER" autocomplete="off" spellcheck="false">
        <button id="btnSave">Speichern</button>
      </div>
    `;
    const input = document.getElementById('nameInput');
    const doSave = () => {
      const name = (input.value.trim() || 'SPIELER').toUpperCase().slice(0, 12);
      addScore(name, finalScore);
      saveArea.innerHTML = `<p class="sub" style="color:#6ee06e">✔ Gespeichert als „${esc(name)}“</p>`;
      document.getElementById('hsArea').innerHTML = highscoreHTML();
      beep(880, 0.09, 'square', 0.05);
      setTimeout(() => beep(1174, 0.12, 'square', 0.05), 90);
    };
    document.getElementById('btnSave').onclick = doSave;
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.stopPropagation(); doSave(); }
    });
    setTimeout(() => input.focus(), 60);
  }
}

// =========================================================
//  EINGABE
// =========================================================
const keys = {};

window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
    e.preventDefault();
  }
  keys[e.code] = true;

  const inInput = document.activeElement && document.activeElement.tagName === 'INPUT';

  if (e.code === 'KeyM') {
    muted = !muted;
  }
  if (e.code === 'KeyP' && !inInput) {
    togglePause();
  }
  if (e.code === 'Enter' && !inInput) {
    if (game.mode === 'start' || game.mode === 'over') startGame();
  }
}, { passive: false });

window.addEventListener('keyup', e => {
  keys[e.code] = false;
});

window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (game.mode === 'playing') game.mode = 'paused';
});

// ---- Touch-Steuerung ----
document.querySelectorAll('#touch button').forEach(btn => {
  const key = btn.dataset.key;
  const down = e => { e.preventDefault(); keys[key] = true; };
  const up   = e => { e.preventDefault(); keys[key] = false; };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
});

// =========================================================
//  HAUPTSCHLEIFE
// =========================================================
let lastTs = 0;

function loop(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 16.6667;
  lastTs = ts;
  dt = Math.min(dt, 2);          // Stabilität bei Frame-Drops

  if (game.mode === 'playing') {
    game.frames += dt;
    updatePlayer(dt);
    if (!player.dead) {
      updateEnemies(dt);
      updateTimer(dt);
    }
    updateParticles(dt);
    updateCamera();
  } else if (game.mode === 'over' || game.mode === 'start') {
    updateParticles(dt);
  }

  if (level) render();
  requestAnimationFrame(loop);
}

// =========================================================
//  INIT
// =========================================================
resetLevel();
showStartScreen();
requestAnimationFrame(loop);
</script>
</body>
